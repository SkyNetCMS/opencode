name: publish-docker

on:
  push:
    tags:
      - "v*-sn"
    branches:
      - skynetcms
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. 1.2.10-sn). Leave empty for auto-detect from branch."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/skynetcms/opencode

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Resolve version and tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push: v1.2.10-sn -> 1.2.10-sn
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            # Manual dispatch with explicit version
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            # Branch push or manual dispatch without version -> preview
            SHA="$(git rev-parse --short=7 HEAD)"
            VERSION="0.0.0-skynetcms-${SHA}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:skynetcms-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.meta.outputs.version }}
          OPENCODE_CHANNEL: skynetcms

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./packages/opencode
          file: ./packages/opencode/Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=opencode (SkyNetCMS)
            org.opencontainers.image.description=OpenCode CLI - SkyNetCMS fork with basePath support
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
